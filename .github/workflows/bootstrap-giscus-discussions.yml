name: Bootstrap Giscus Discussions

# Creates pathname-titled Ideas discussions and commits filled giscus_mapping.json.
# Uses GITHUB_TOKEN (discussions: write) so local PATs without Discussions scope still work.
on:
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap discussions + mapping
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x docs/planner-docs/scripts/bootstrap_giscus_discussions.sh
          docs/planner-docs/scripts/bootstrap_giscus_discussions.sh

      - name: Commit mapping if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planner-docs/giscus_mapping.json
          if git diff --staged --quiet; then
            echo "No mapping changes"
          else
            git commit -m "chore: fill giscus_mapping.json discussion IDs"
            git push
          fi
