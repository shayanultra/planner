name: Deploy Planner-AI-Docs
on:
  push:
    branches:
      - main
    paths:
      - 'docs/planner-docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Architecture Engine & Plugins
        run: |
          python -m pip install -U pip
          pip install mkdocs-material

      - name: Compile and Deploy to GitHub Pages
        run: |
          cd docs/planner-docs
          mkdocs gh-deploy --force
